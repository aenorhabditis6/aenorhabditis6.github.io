<!doctype html>
<!-- What the NFC ring and sticker are written with, locked: https://aenorhabditis6.github.io/r/
     The tags can never change, so this file is the one place that decides where a tap goes.
     A static host has no server-side redirect, so it is done here, in both ways a browser
     honours one. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Tina Shen</title>
    <meta http-equiv="refresh" content="0; url=/hi/" />
    <script>
      location.replace("/hi/");
    </script>
  </head>
  <body style="background: #fafafa; font-family: system-ui, sans-serif">
    <p><a href="/hi/">Tina Shen</a></p>
  </body>
</html>
